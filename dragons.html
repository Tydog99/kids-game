<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dragon Designs</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23d8432f%27/%3E%3Cpath d=%27M3 11 8 4l5 7z%27 fill=%27%23f5cf86%27/%3E%3C/svg%3E" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage"></div>
    <header class="top">
      <h1>Dragon <span>Designs</span></h1>
      <p>Three dragons for Voxel Explorer. Each one walks on all fours, rears up on its back legs, and flies. Drag to look around.</p>
    </header>
    <section class="dock">
      <div class="poses" role="radiogroup" aria-label="Pose">
        <button data-mode="auto" role="radio">Auto</button>
        <button data-mode="walk" role="radio">Walk</button>
        <button data-mode="rear" role="radio">Rear up</button>
        <button data-mode="fly" role="radio">Fly</button>
      </div>
      <div class="cards"></div>
    </section>
    <script type="module" src="/src/dragonViewer.js"></script>
  </body>
</html>
